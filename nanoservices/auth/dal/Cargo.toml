[package]
name = "auth-dal"
version = "0.1.0"
edition = "2024"

[dependencies]
serde ={ version="1.0.197", features = ["derive"] }
glue = { path = "../../../glue"}
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "tls-rustls", "migrate", "postgres", "json"]}
argon2 = { version = "0.5.3", features = ["password-hash"]}
uuid = {version = "1.8.0", features = ["serde", "v4"]}
rand = "0.8.5"
dotenv = { version = "0.15" }
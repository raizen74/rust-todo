services:
  db:
    image: postgres:latest
    container_name: pg-dev
    restart: always
    environment:
      POSTGRES_USER: username
      POSTGRES_DB: to_do
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
  cache:
    container_name: 'to-do-redis'
    build: './nanoservices/user-session-cache/cache-module'
    restart: always
    ports:
      - '6379:6379'
